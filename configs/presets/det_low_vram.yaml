# Детекция — для видеокарт с малым объёмом памяти.
# Профиль подставляет только гиперпараметры обучения; модель, датасет и устройство не меняет.
# Описание параметров — подсказки в интерфейсе (src/neuro_trainer/params_catalog.py).

epochs: 80
patience: 15
batch: 8
imgsz: 512
rect: false
multi_scale: 0.0
lr0: 0.008
lrf: 0.02
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
