# Классификация — для видеокарт с малым объёмом памяти.
# Профиль подставляет только гиперпараметры обучения; модель, датасет и устройство не меняет.
# Описание параметров — подсказки в интерфейсе (src/neuro_trainer/params_catalog.py).

epochs: 40
patience: 10
batch: 16
imgsz: 256
lr0: 0.008
lrf: 0.02
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
auto_augment: randaugment
erasing: 0.2
dropout: 0.0
