# Классификация — для малой VRAM (4–6 ГБ)
model_name: "yolo11n-cls.pt"
pretrained_model_path: ""
task_override: ""
profile: "low_vram"

data: ""
project_dir: "./runs"
name: ""
auto_increment_name: true

epochs: 40
patience: 10
batch: 16
imgsz: 256

seed: 0
