[tool.poetry]
name = "neuro-trainer"
version = "0.1.0"
description = ""
authors = ["omigutin <migutin83@yandex.ru>"]
readme = "README.md"

packages = [{ include = "neuro_trainer", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
# 8.4 — YOLO26; параметры каталога (params_catalog.py) сверены с ultralytics/cfg/default.yaml 8.4
ultralytics = ">=8.4.118,<8.5"

# Веб-интерфейс (extra `web`)
fastapi = {version = ">=0.115,<1", optional = true}
uvicorn = {version = ">=0.32", optional = true}
jinja2 = {version = "^3.1", optional = true}

# torch/torchvision с поддержкой CUDA 12.6 (Windows/Linux). На PyPI для Windows есть только CPU-сборка.
# На macOS CUDA нет — берём обычную сборку с PyPI (MPS).
torch = [
    { version = "2.7.1", source = "pytorch-cuda", markers = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { version = "2.7.1", markers = "sys_platform == 'darwin'" },
]
torchvision = [
    { version = "0.22.1", source = "pytorch-cuda", markers = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { version = "0.22.1", markers = "sys_platform == 'darwin'" },
]

[tool.poetry.extras]
web = ["fastapi", "uvicorn", "jinja2"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = ">=0.27"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
